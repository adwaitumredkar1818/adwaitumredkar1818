# Save this file as .github/workflows/profile-3d-contrib.yml
# in your profile repo: adwaitumredkar1818/adwaitumredkar1818

name: generate-3d-contrib

on:
  schedule:
    - cron: "0 0 * * *"   # refresh daily at midnight UTC
  workflow_dispatch:       # lets you run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Check the project's README for the latest version tag before running:
      # https://github.com/yoshi389111/github-profile-3d-contrib
      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: adwaitumredkar1818

      # Publish to the "output" branch without deleting the snake SVGs
      - name: Publish to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          keep_files: true
